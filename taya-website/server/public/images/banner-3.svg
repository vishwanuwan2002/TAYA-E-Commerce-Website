<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#fef2f2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fee2e2;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#fef2f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(220, 38, 38, 0.1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(220, 38, 38, 0);stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgGradient3)"/>
  <circle cx="960" cy="300" r="400" fill="url(#centerGlow)"/>

  <!-- Abstract background elements -->
  <ellipse cx="300" cy="200" rx="120" ry="80" fill="rgba(0, 0, 0, 0.04)" transform="rotate(-15 300 200)"/>
  <ellipse cx="1600" cy="400" rx="100" ry="60" fill="rgba(220, 38, 38, 0.06)" transform="rotate(20 1600 400)"/>

  <!-- Floating elements -->
  <g opacity="0.8">
    <rect x="150" y="150" width="30" height="30" fill="rgba(220, 38, 38, 0.2)" transform="rotate(45 165 165)"/>
    <rect x="1720" y="180" width="25" height="25" fill="rgba(0, 0, 0, 0.15)" transform="rotate(30 1732.5 192.5)"/>
    <circle cx="450" cy="100" r="20" fill="rgba(220, 38, 38, 0.1)"/>
    <circle cx="1400" cy="500" r="15" fill="rgba(0, 0, 0, 0.08)"/>
  </g>

  <!-- Main text -->
  <text x="960" y="240" font-family="Inter, sans-serif" font-size="64" font-weight="700" text-anchor="middle" fill="#000000">
    New Season Arrivals
  </text>

  <text x="960" y="300" font-family="Inter, sans-serif" font-size="36" font-weight="500" text-anchor="middle" fill="#dc2626">
    Trendsetting Fashion
  </text>

  <text x="960" y="340" font-family="Inter, sans-serif" font-size="22" font-weight="300" text-anchor="middle" fill="#374151">
    Discover the latest in contemporary design
  </text>

  <text x="960" y="380" font-family="Inter, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#6b7280">
    Quality craftsmanship meets modern aesthetics
  </text>

  <!-- Decorative elements -->
  <line x1="860" y1="400" x2="1060" y2="400" stroke="#dc2626" stroke-width="3" opacity="0.6"/>
  <circle cx="860" cy="400" r="4" fill="#dc2626" opacity="0.8"/>
  <circle cx="1060" cy="400" r="4" fill="#dc2626" opacity="0.8"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 0, 0, 0.02)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="600" fill="url(#grid)" opacity="0.3"/>
</svg>