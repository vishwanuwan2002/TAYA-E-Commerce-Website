<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fff5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee2e2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b91c1c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7f1d1d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgGradient)"/>

  <!-- Decorative elements -->
  <circle cx="1600" cy="150" r="80" fill="rgba(220, 38, 38, 0.1)" opacity="0.6"/>
  <circle cx="200" cy="450" r="60" fill="rgba(220, 38, 38, 0.08)" opacity="0.4"/>
  <circle cx="1700" cy="500" r="40" fill="rgba(0, 0, 0, 0.05)" opacity="0.3"/>

  <!-- Geometric shapes -->
  <polygon points="1800,100 1850,50 1900,100" fill="rgba(220, 38, 38, 0.15)" opacity="0.5"/>
  <rect x="100" y="80" width="60" height="60" fill="rgba(0, 0, 0, 0.1)" opacity="0.3" transform="rotate(45 130 110)"/>

  <!-- Main text -->
  <text x="960" y="280" font-family="Inter, sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="url(#textGradient)">
    Welcome to Taya
  </text>

  <text x="960" y="350" font-family="Inter, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#1f2937">
    Discover Premium Fashion & Lifestyle
  </text>

  <text x="960" y="390" font-family="Inter, sans-serif" font-size="18" font-weight="300" text-anchor="middle" fill="#6b7280">
    Modern. Elegant. Timeless.
  </text>

  <!-- Floating elements -->
  <g opacity="0.7">
    <circle cx="300" cy="200" r="3" fill="#dc2626"/>
    <circle cx="400" cy="180" r="2" fill="#dc2626"/>
    <circle cx="500" cy="220" r="4" fill="#dc2626"/>
    <circle cx="1400" cy="250" r="3" fill="#000000"/>
    <circle cx="1500" cy="230" r="2" fill="#000000"/>
    <circle cx="1600" cy="270" r="4" fill="#000000"/>
  </g>
</svg>